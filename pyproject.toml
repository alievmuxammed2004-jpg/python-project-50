[project]
name = "hexlet-code"
version = "0.1.0"
description = "gendiff - compares two configuration files"
authors = [
  {name = "alievmuxammed2004-jpg", email = "alievmuxammed2004@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0.3,<7.0.0"
]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[tool.poetry.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["gendiff"]

[tool.coverage.report]
fail_under = 80
show_missing = true